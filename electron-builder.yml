appId: com.yusepe.bento
productName: YUSEPE Bento
directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

# node-pty trae binarios nativos (.node) y un ejecutable (spawn-helper) que
# tienen que existir como archivos reales en disco — no pueden correr desde
# adentro de un archivo asar.
asarUnpack:
  - '**/node_modules/node-pty/**/*'

# El CLI `ybento` (el que usan los agentes del loop para mandarse mensajes)
# se copia como fuente, fuera del asar: lo ejecuta el binario de la app con
# ELECTRON_RUN_AS_NODE, así que tiene que ser un archivo real en disco y no
# el bundle del proceso main.
#
# Se copia con la estructura de `src/` intacta a propósito: `cli/run.js`
# importa `../main/loopOps.js`, y el `package.json` con "type": "module" es
# lo que hace que Node los lea como ESM.
extraResources:
  - from: src
    to: ybento-cli/src
    filter:
      - package.json
      - cli/**/*.{js,mjs}
      - '!cli/**/*.test.js'
      - main/loopOps.js
  # Página del loop remoto (spec 041): la sirve el proceso main al teléfono.
  - from: src/remote
    to: remote

mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  icon: build/icon.png
  # Sin cuenta de Apple Developer: build sin firmar. Gatekeeper va a pedir
  # "click derecho > Abrir" la primera vez que se instale.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  # Texto del permiso de micrófono de macOS (dictado del loop, spec 040, y
  # llamadas en webviews). Sin esto se ve el genérico de Electron en inglés.
  extendInfo:
    NSMicrophoneUsageDescription: Bento usa el micrófono para dictarle prompts a los agentes y para las llamadas en tus apps web. El audio del dictado no sale de tu máquina.
    NSCameraUsageDescription: Bento usa la cámara sólo para las videollamadas de tus apps web.

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Utility

publish: null

# Electron de castLabs (Electron for Content Security): el mismo Electron
# más el CDM de Widevine, para que los webviews reproduzcan Netflix y
# similares. Se instala desde github:castlabs/electron-releases (ver
# package.json). Primero se intenta empaquetar la distribución ya
# instalada; si electron-builder decide descargar (lo hace cuando la
# versión lleva sufijo), que lo baje del espejo de castLabs y no del
# oficial, donde esa versión no existe. Después de empaquetar hay que
# firmar con VMP (servicio EVS de castLabs): `npm run vmp-sign`.
electronDist: node_modules/electron/dist
electronDownload:
  mirror: https://github.com/castlabs/electron-releases/releases/download/v
